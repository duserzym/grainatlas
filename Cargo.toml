[workspace]
resolver = "3"
members = ["crates/grainatlas-core", "crates/grainatlas-wasm", "crates/grainatlas-cli", "tauri/src-tauri"]
default-members = ["crates/grainatlas-core", "crates/grainatlas-cli"]

[workspace.package]
version = "0.1.7"
edition = "2024"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/duserzym/grainatlas"

[workspace.dependencies]
grainatlas-core = { path = "crates/grainatlas-core" }
# photocraft-algo, pinned (ADR-0002). MIT OR Apache-2.0.
photocraft-algo = { git = "https://github.com/storytold/photocraft", rev = "81bd97376f881ee3561371b7da52780844d3dfc7" }
photocraft-geom = { git = "https://github.com/storytold/photocraft", rev = "81bd97376f881ee3561371b7da52780844d3dfc7" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
anyhow = "1"

[profile.release]
opt-level = 3
debug-assertions = false
debug = false
lto = "thin"
codegen-units = 4

# Image work is unusably slow unoptimised; tests run the core at opt-level 3.
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.grainatlas-core]
opt-level = 3
[profile.test]
opt-level = 3
