# Pre-release: runs on v* tags and by hand only; push triggers return at the first release (see README).
name: desktop
# Builds the Tauri desktop app for macOS (arm64) and Windows (x86-64) and keeps
# signed installers and latest.json in a draft release on tags. Manual runs
# keep installers as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    # grainatlas and upbstudio side by side for @lab/bridge (see ci.yml).
    defaults:
      run:
        working-directory: grainatlas
    steps:
      - uses: actions/checkout@v4
        with:
          path: grainatlas
      - uses: actions/checkout@v4
        with:
          repository: duserzym/upbstudio
          path: upbstudio
          token: ${{ secrets.UPBSTUDIO_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: grainatlas
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: grainatlas/ui/pnpm-lock.yaml
      - name: Tools
        shell: bash
        run: |
          cargo install --locked tauri-cli --version '^2'
          V=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p' | head -1)
          cargo install --locked wasm-bindgen-cli --version "$V"
          (cd ../upbstudio && pnpm install --frozen-lockfile --filter @lab/bridge && pnpm --filter @lab/bridge build)
          cd ui && pnpm install --frozen-lockfile
      - name: Web build (wasm core + UI)
        shell: bash
        run: |
          cargo build -p grainatlas-wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --out-dir ui/src/lib/core/pkg --out-name grainatlas target/wasm32-unknown-unknown/release/grainatlas_wasm.wasm
          cd ui && pnpm build
      - name: Icons
        shell: bash
        run: cd tauri && cargo tauri icon assets-icon.svg -o src-tauri/icons
      - name: Tag matches the version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          make check-version
          VERSION=$(node scripts/check-version.mjs)
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but version is $VERSION"; exit 1; }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: grainatlas/tauri
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: grainatlas ${{ github.ref_name }}
          releaseBody: |
            Download the .dmg for macOS (Apple Silicon), or the .msi / -setup.exe for Windows.

            First launch on macOS: open the app once, then System Settings > Privacy & Security > Open Anyway. Later versions install from inside grainatlas.
      - name: Upload installers (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: grainatlas-${{ matrix.target }}
          path: |
            grainatlas/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            grainatlas/target/${{ matrix.target }}/release/bundle/macos/*.app
            grainatlas/target/${{ matrix.target }}/release/bundle/msi/*.msi
            grainatlas/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore
