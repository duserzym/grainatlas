name: desktop
# Builds the Tauri desktop app for macOS (arm64) and Windows (x86-64) and keeps
# the installers as artifacts. Configured but not exercised locally (only the
# macOS build was run on the development machine).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Tools
        shell: bash
        run: |
          cargo install --locked tauri-cli --version '^2'
          V=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p' | head -1)
          cargo install --locked wasm-bindgen-cli --version "$V"
          cd ui && pnpm install --frozen-lockfile
      - name: Web build (wasm core + UI)
        shell: bash
        run: |
          cargo build -p grainmap-wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --out-dir ui/src/lib/core/pkg --out-name grainmap target/wasm32-unknown-unknown/release/grainmap_wasm.wasm
          cd ui && pnpm build
      - name: Icons
        shell: bash
        run: cd tauri && cargo tauri icon assets-icon.svg -o src-tauri/icons
      - name: Desktop build
        shell: bash
        run: cd tauri && cargo tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: grainmap-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
