# Publishes the project website (site/ plus the docs/images screenshots) to GitHub Pages.
# By hand only: `gh workflow run pages`. Pages must first be enabled for the repository
# (Settings → Pages → Source: GitHub Actions).
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: make site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site
      - id: deployment
        uses: actions/deploy-pages@v4
