# Pre-release: runs on v* tags and by hand only; push triggers return at the first release (see README).
name: ci
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # grainatlas and upblab side by side: @lab/bridge is "file:../../upblab/bridge"
    # until it is published (README, Dependencies). Private upblab: UPBSTUDIO_TOKEN secret.
    defaults:
      run:
        working-directory: grainatlas
    steps:
      - uses: actions/checkout@v4
        with:
          path: grainatlas
      - uses: actions/checkout@v4
        with:
          repository: duserzym/upblab
          path: upblab
          token: ${{ secrets.UPBSTUDIO_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: grainatlas
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: grainatlas/ui/pnpm-lock.yaml
      # The same entry points as on a laptop: core tests, wasm/native parity, Playwright.
      - run: make setup
      - run: make test
